version: 2

models:
  - name: stg_market_data
    description: "Cleaned and typed market data unnested from bronze raw payloads."
    columns:
      - name: symbol
        description: "Ticker symbol of the asset or index."
        tests:
          - not_null

      - name: trade_date
        description: "Date of the market session."
        tests:
          - not_null

      - name: close_price
        description: "Closing price of the asset."
        tests:
          - not_null

      - name: volume
        description: "Trading volume for the session."
        tests:
          - not_null